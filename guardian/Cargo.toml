[package]
name = "guardian"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MANDATE Guardian — OutLayer TEE WASM attestor (commit/reveal GuardianReport)"

# The WASM target builds a binary (fn main reads stdin / writes stdout, the
# OutLayer convention). On the host we only build+test the pure-logic library,
# so the outlayer/wasi glue never has to compile off wasm32.
[[bin]]
name = "guardian"
path = "src/main.rs"

[lib]
name = "guardian"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

# OutLayer SDK (env::input/output) and the WASI HTTP client only exist on the
# wasm32-wasip2 target. Gating them keeps `cargo test` on the host clean.
[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = "0.2"
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
