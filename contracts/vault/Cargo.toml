[package]
name = "vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# near-sdk 5.30.0 — pinned to match contracts/coordinator/Cargo.toml (verified latest stable 2026-11-03).
near-sdk = "5.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# keccak256 for the EVM signer payload. no_std, pure-Rust, builds clean on
# wasm32-unknown-unknown (no libc). RLP is hand-rolled in evm.rs (minimal,
# covers the legacy + EIP-1559 fields we need).
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
