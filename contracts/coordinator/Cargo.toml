[package]
name = "coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# near-sdk 5.30.0 is the latest stable on crates.io (verified 2026-11-03), compatible with Rust 1.99.
near-sdk = "5.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
