[workspace]
resolver = "2"
members = [
    "contracts/coordinator",
    "contracts/vault",
    "contracts/registry",
    "guardian",
    "integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
