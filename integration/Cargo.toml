[package]
name = "integration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# No library/binary — this crate exists purely for the near-workspaces sandbox
# integration tests under `tests/`.
[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# near-workspaces spins up a local `neard` sandbox, deploys the compiled wasms,
# and drives real cross-contract calls. 0.24 matches near-sdk 5.x.
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
